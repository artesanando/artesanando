name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # a checagem de celular roda contra o fake do Supabase: sem credencial e
      # sem rede, só o navegador
      - run: npx playwright install --with-deps chromium
      - run: npm run check:mobile
